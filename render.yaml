# Render Blueprint: cria o servidor do app e o banco PostgreSQL de uma vez.
# Passo a passo em COMO-INSTALAR-NO-CELULAR.md.
services:
  - type: web
    name: vozes-em-maos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vozes-em-maos-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Retreinou o modelo? Troque aqui também (além do backend/.env).
      - key: MODEL_PATH
        value: models/libras_grupo_2026-11-02.joblib

databases:
  - name: vozes-em-maos-db
    plan: free
