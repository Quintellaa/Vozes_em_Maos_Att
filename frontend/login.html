<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vozes em Mãos"><title>Vozes em Mãos — Entrar</title><link rel="icon" type="image/png" href="img/icone-192.png"><link rel="apple-touch-icon" href="img/icone-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head>
<body data-page="login">
<main class="app main form lg">
  <a class="back" href="index.html" aria-label="Voltar"><i data-i="back"></i></a>

  <div class="lg-abas" role="tablist" aria-label="Entrar ou criar conta">
    <button type="button" role="tab" id="abaEntrar" aria-controls="fEntrar" aria-selected="true">Entrar</button>
    <button type="button" role="tab" id="abaCriar" aria-controls="fCriar" aria-selected="false">Criar conta</button>
  </div>

  <!-- ============ Entrar ============ -->
  <form id="fEntrar" role="tabpanel" aria-labelledby="abaEntrar" novalidate>
    <h2>Bem-vindo de volta!</h2>
    <p class="mute sm">Acesse sua conta para continuar suas traduções e estudos.</p>

    <label class="lbl" for="em">E-MAIL</label>
    <div class="inp"><i data-i="mail"></i><input id="em" name="email" type="email" placeholder="seu@email.com" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required></div>

    <div class="lbl"><label for="pw">SENHA</label><a class="link" href="#" id="esqueci">Esqueci a senha</a></div>
    <div class="inp"><i data-i="lock"></i><input id="pw" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required><button type="button" class="lg-olho" data-olho="pw" aria-label="Mostrar senha"><i data-i="eye"></i></button></div>

    <p class="err" id="errEntrar" role="alert"></p>
    <button class="btn pri" type="submit" id="btnEntrar">Entrar</button>
    <p class="sm mute c lg-troca">Não tem uma conta? <a class="link" href="#criar" data-ir="criar">Crie agora</a></p>
  </form>

  <!-- ============ Criar conta ============ -->
  <form id="fCriar" role="tabpanel" aria-labelledby="abaCriar" novalidate hidden>
    <h2>Crie sua conta</h2>
    <p class="mute sm">Leva menos de um minuto. Seu histórico, comunidades e foto ficam salvos na conta.</p>

    <label class="lbl" for="cNome">NOME</label>
    <div class="inp"><i data-i="user"></i><input id="cNome" type="text" placeholder="Como você quer ser chamado" autocomplete="name" maxlength="60" required></div>

    <label class="lbl" for="cEm">E-MAIL</label>
    <div class="inp"><i data-i="mail"></i><input id="cEm" name="email" type="email" placeholder="seu@email.com" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required></div>

    <label class="lbl" for="cPw">SENHA</label>
    <div class="inp"><i data-i="lock"></i><input id="cPw" name="new-password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required aria-describedby="forca"><button type="button" class="lg-olho" data-olho="cPw" aria-label="Mostrar senha"><i data-i="eye"></i></button></div>
    <div class="lg-forca" id="forca" aria-live="polite"><span></span><span></span><span></span><small></small></div>

    <label class="lbl" for="cPw2">CONFIRMAR SENHA</label>
    <div class="inp"><i data-i="lock"></i><input id="cPw2" name="confirm-password" type="password" placeholder="Repita a senha" autocomplete="new-password" required><button type="button" class="lg-olho" data-olho="cPw2" aria-label="Mostrar senha"><i data-i="eye"></i></button></div>

    <p class="err" id="errCriar" role="alert"></p>
    <button class="btn pri" type="submit" id="btnCriar">Criar conta</button>
    <p class="sm mute c lg-troca">Já tem uma conta? <a class="link" href="#entrar" data-ir="entrar">Entrar</a></p>
  </form>

</main>
<div id="toast" role="status"></div><script src="js/dom.js"></script><script src="js/icons.js"></script><script src="js/storage.js"></script><script src="js/preferencias.js"></script><script src="js/api.js"></script><script src="js/session.js"></script><script src="js/history.js"></script><script src="js/nav.js"></script><script src="js/pages.js"></script><script src="js/app.js"></script></body></html>
