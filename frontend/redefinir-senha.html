<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="referrer" content="no-referrer"><link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vozes em Mãos"><title>Vozes em Mãos — Nova senha</title><link rel="icon" type="image/png" href="img/icone-192.png"><link rel="apple-touch-icon" href="img/icone-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head>
<body data-page="redefinir">
<main class="app main form lg">
  <a class="back" href="login.html" aria-label="Voltar"><i data-i="back"></i></a>

  <!-- Aberta pelo link do e-mail de "Esqueci a senha" (o token vem depois do #) -->
  <form id="fRedefinir" novalidate>
    <h2>Crie uma nova senha</h2>
    <p class="mute sm">Escolha uma senha que você não usa em outros sites. Depois de salvar, você já entra no app.</p>

    <label class="lbl" for="rPw">NOVA SENHA</label>
    <div class="inp"><i data-i="lock"></i><input id="rPw" name="new-password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required><button type="button" class="lg-olho" data-olho="rPw" aria-label="Mostrar senha"><i data-i="eye"></i></button></div>

    <label class="lbl" for="rPw2">CONFIRMAR NOVA SENHA</label>
    <div class="inp"><i data-i="lock"></i><input id="rPw2" name="confirm-password" type="password" placeholder="Repita a senha" autocomplete="new-password" required><button type="button" class="lg-olho" data-olho="rPw2" aria-label="Mostrar senha"><i data-i="eye"></i></button></div>

    <p class="err" id="errRedefinir" role="alert"></p>
    <button class="btn pri" type="submit" id="btnRedefinir">Salvar nova senha</button>
  </form>

  <div id="semToken" hidden>
    <h2>Link inválido</h2>
    <p class="mute sm">Este endereço não tem o código de redefinição. Abra o link direto do e-mail ou peça um novo.</p>
    <a class="btn pri" href="login.html#esqueci">Pedir novo link</a>
  </div>
</main>
<div id="toast" role="status"></div><script src="js/dom.js"></script><script src="js/icons.js"></script><script src="js/storage.js"></script><script src="js/preferencias.js"></script><script src="js/api.js"></script><script src="js/session.js"></script><script src="js/history.js"></script><script src="js/nav.js"></script><script src="js/pages.js"></script><script src="js/app.js"></script></body></html>
