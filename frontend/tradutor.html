<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vozes em Mãos"><title>Vozes em Mãos — Tradutor</title><link rel="icon" type="image/png" href="img/icone-192.png"><link rel="apple-touch-icon" href="img/icone-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="tradutor" data-auth>
<div class="app" id="app"><header class="top vlibras-ignore"><div class="logo s"><img src="img/icone-64.png" alt=""></div><b>Vozes em Mãos</b><a href="historico.html" aria-label="Histórico"><button style="pointer-events:none"><i data-i="history"></i></button></a><a href="perfil.html" class="ava" data-ini aria-label="Perfil" style="text-decoration:none"></a></header>
<main class="main tr" id="cards">
<section class="card vlibras-ignore"><span class="chip">● LIBRAS → TEXTO</span><video id="video" autoplay playsinline muted hidden></video><canvas id="handOverlay" class="hand-overlay" hidden></canvas><div class="hands" id="hands">🙌</div>
<div class="trans trans-sm"><span id="trans">Ative a câmera para traduzir sinais.</span>
<div class="phrase" id="phraseBox" hidden><p id="phrase" aria-live="polite"></p><div class="phrase-act"><button type="button" id="speak">🔊 Ouvir frase</button><button type="button" id="clearPhrase">Limpar</button></div></div>
</div><details class="known known-chip"><summary aria-label="Sinais que reconheço">Sinais</summary><p id="knownList">Carregando...</p></details></section>
<section class="card dark libras" id="avatar"><span class="chip b vlibras-ignore">TEXTO → LIBRAS</span>
<div class="libras-stage" id="librasStage"><p class="libras-hint vlibras-ignore" id="librasHint">Digite ou fale uma frase abaixo. O avatar do VLibras vai sinalizar.</p></div>
<div class="libras-foot vlibras-ignore"><p class="libras-text" id="out"></p>
<button class="play vlibras-ignore" id="play" hidden><i data-i="play"></i>DE NOVO</button></div></section></main>
<form class="bar vlibras-ignore" id="form"><button type="button" class="mic" id="mic" aria-label="Falar"><i data-i="mic"></i></button><label class="txt"><input id="txt" placeholder="Digite para traduzir..." autocomplete="off"><button class="send" aria-label="Traduzir"><i data-i="send"></i></button></label><button type="button" class="swap" id="swap" aria-label="Inverter"><i data-i="swap"></i></button></form>
<nav class="tabs vlibras-ignore" id="nav"></nav></div>
